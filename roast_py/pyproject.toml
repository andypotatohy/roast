[project]
name = "roast-py"
version = "0.0.1"
description = "Python port of ROAST's core TES simulation pipeline (no MATLAB required)"
requires-python = ">=3.11,<3.14"
# Everything roast() needs at runtime, as ranges so `pip install -e .` can
# coexist with other packages. The exact versions roast_py was verified
# with are in requirements-lock.txt (== TESTED_ENVIRONMENT in
# roast_py/dependencies.py), and roast() installs those before it runs.
# Kept in sync with roast_py/dependencies.py -- tests/test_dependencies.py
# fails if they drift.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scikit-image>=0.21",
    "tensorflow>=2.16",
    # The bundled lib/multiaxial/*.h5 models were saved under Keras 2 and
    # cannot be loaded by Keras 3 (TF >= 2.16's default). See
    # roast_py/segmentation/_keras_compat.py.
    #
    # The >=2.16 floor is load-bearing, not cosmetic: tf-keras < 2.16 calls
    # tf.compat.v2.__internal__.register_load_context_function, which
    # TensorFlow removed in 2.16, so an older tf-keras beside a modern
    # TensorFlow fails with a bare AttributeError on import. Unpinned, pip
    # will happily backtrack to those releases when it can't reconcile an
    # already-installed (e.g. conda-managed) TensorFlow. tf-keras X.Y must
    # match tensorflow X.Y; requirements-lock.txt pins both to 2.21.
    "tf-keras>=2.16",
    # roast() visualizes its results at the end, as MATLAB's does:
    # matplotlib for the slice viewers, PyVista (VTK) for the 3D views.
    "matplotlib>=3.7",
    "pyvista>=0.43",
]

[project.optional-dependencies]
# Phases that aren't implemented yet -- listed so the intent is on record,
# but not required to run roast().
targeting = ["cvxpy>=1.4"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roast_py*"]

[tool.pytest.ini_options]
markers = [
    "slow: full end-to-end tests (e.g. real model inference) that take more than a few seconds",
]
